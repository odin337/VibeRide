apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-game
  namespace: viberide
  labels:
    app.kubernetes.io/name: web-game
    app.kubernetes.io/part-of: viberide
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-game
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-game
        app.kubernetes.io/part-of: viberide
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-game
          # TODO(manual): replace OWNER/REPO with the lowercase GitHub owner/repo
          # and pin a git-SHA tag published by CI instead of latest.
          image: ghcr.io/OWNER/REPO/web-game:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Appended to nginx's CSP connect-src (template rendered at start).
            - name: CSP_CONNECT_SRC
              valueFrom:
                configMapKeyRef:
                  name: viberide-config
                  key: CSP_CONNECT_SRC_WEB
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # nginx-unprivileged keeps its pid file and temp paths under /tmp;
            # the envsubst entrypoint renders templates into /etc/nginx/conf.d.
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
