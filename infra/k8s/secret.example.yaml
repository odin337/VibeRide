# =============================================================================
# TEMPLATE ONLY — never commit a populated copy of this file.
# =============================================================================
# Preferred: create the secret imperatively so values never touch the repo:
#
#   kubectl -n viberide create secret generic viberide-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=TELEGRAM_BOT_TOKEN='<token from @BotFather>'
#
# If you must keep a manifest, copy this file to secret.yaml OUTSIDE the repo
# (or use sealed-secrets/SOPS) and fill in real values there.
apiVersion: v1
kind: Secret
metadata:
  name: viberide-secrets
  namespace: viberide
  labels:
    app.kubernetes.io/name: viberide
type: Opaque
stringData:
  # TODO(manual): >= 256-bit random value, e.g. `openssl rand -base64 48`.
  JWT_SECRET: 'REPLACE_ME'
  # TODO(manual): bot token from @BotFather — used server-side to validate
  # Telegram initData HMAC signatures (see apps/telegram-adapter/README.md).
  TELEGRAM_BOT_TOKEN: 'REPLACE_ME'
