<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0f14" />
    <title>VibeRide</title>
    <style>
      :root {
        --tg-bg: #0f0f14;
        --tg-text: #f2f2f2;
        --tg-accent: #6ab3f3;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Telegram-friendly: no scroll bounce / pull-to-collapse gestures. */
        overscroll-behavior: none;
      }

      body {
        position: fixed;
        inset: 0;
        background: var(--tg-bg);
        color: var(--tg-text);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
