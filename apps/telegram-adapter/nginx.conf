# VibeRide Telegram Mini App — static SPA behind unprivileged nginx (8080).
# This file is an envsubst TEMPLATE: ${CSP_CONNECT_SRC} is substituted at
# container start by the nginx image entrypoint (20-envsubst-on-templates.sh).
# nginx runtime variables ($uri, $cache_control) are left untouched because
# only defined environment variables are substituted.

# Long-lived caching for hashed build assets, no caching for the HTML shell.
map $uri $cache_control {
    default "no-cache";
    ~\.(?:js|mjs|css|woff2?|png|jpg|jpeg|webp|svg|mp3|ogg|wav|wasm)$ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- transport ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # --- security headers (server-level add_header applies to all locations
    #     below because none of them declares add_header of its own) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Minimal: the game uses none of these powerful features (haptics go
    # through the Telegram SDK, not the web Vibration API).
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    # frame-ancestors https://web.telegram.org: Telegram Web (K/Z) embeds the
    # Mini App in an iframe on that origin; native clients use a webview where
    # frame-ancestors does not apply. style-src 'unsafe-inline': the Vite HTML
    # shell carries an inline <style> block. blob:/data: in media/worker/img:
    # the audio engine decodes tracks via blob URLs and audio worklets.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org" always;
    add_header Cache-Control $cache_control always;

    # Container / Kubernetes health probes.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA fallback: unknown routes serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
